[project]
authors = [{name = "Alexey Shiklomanov", email = "alexey.shiklomanov@gmail.com"}]
description = "Add a short description here"
name = "m21c-experiments"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
  "humanreadable >=0.4.0, <0.5",
  "humanize >=4.11.0, <5"
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
m21c_experiments = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.13.0,<4"
h5py = ">=3.12.1,<4"
xarray = ">=2024.10.0,<2025"
h5netcdf = ">=1.4.1,<2"
ipython = ">=8.29.0,<9"
s3fs = ">=2024.12.0,<2025"
tqdm = ">=4.67.1,<5"
dask = ">=2024.12.1,<2025"
natsort = ">=8.4.0,<9"
rechunker = ">=0.5.2,<0.6"

[tool.pixi.system-requirements]
linux = "4.12"
libc = "2.22"

[tool.pixi.tasks]
